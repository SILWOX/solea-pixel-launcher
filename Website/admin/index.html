<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Solea Pixel — Admin actus</title>
    <link rel="icon" type="image/png" href="../assets/logo.png" sizes="32x32" />
    <style>
      :root {
        --bg: #0f1218;
        --panel: #171b24;
        --text: #e8eaef;
        --muted: #8b93a7;
        --accent: #ff7d33;
        --border: #2a3140;
        --err: #f87171;
        --ok: #4ade80;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.45;
      }
      .wrap {
        max-width: 52rem;
        margin: 0 auto;
        padding: 1.25rem 1rem 2rem;
      }
      h1 {
        font-size: 1.15rem;
        font-weight: 700;
        margin: 0 0 0.35rem;
      }
      .sub {
        color: var(--muted);
        font-size: 0.88rem;
        margin: 0 0 1.25rem;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1rem;
        margin-bottom: 1rem;
      }
      label {
        display: block;
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--muted);
        margin-bottom: 0.25rem;
      }
      input[type='text'],
      input[type='password'],
      input[type='number'],
      textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.5rem 0.65rem;
        background: #0c0f14;
        color: var(--text);
        font: inherit;
      }
      textarea {
        min-height: 8rem;
        resize: vertical;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        margin-top: 0.65rem;
      }
      button {
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        border-radius: 8px;
        border: none;
        padding: 0.45rem 0.85rem;
        background: var(--accent);
        color: #111;
      }
      button.secondary {
        background: #2a3140;
        color: var(--text);
      }
      button.danger {
        background: #7f1d1d;
        color: #fecaca;
      }
      .msg {
        font-size: 0.85rem;
        margin-top: 0.5rem;
      }
      .msg.err {
        color: var(--err);
      }
      .msg.ok {
        color: var(--ok);
      }
      ul.posts {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      ul.posts li {
        border-bottom: 1px solid var(--border);
        padding: 0.65rem 0;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: flex-start;
        justify-content: space-between;
      }
      ul.posts li:last-child {
        border-bottom: none;
      }
      .post-meta {
        font-size: 0.8rem;
        color: var(--muted);
      }
      .post-title {
        font-weight: 600;
      }
      a.home {
        color: var(--accent);
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a class="home" href="/">← Site</a>
      <h1>Admin — actus Solea Pixel</h1>
      <p class="sub">
        Token défini dans Netlify (<code>NEWS_ADMIN_TOKEN</code>), jamais commité. Connexion HTTPS uniquement.
      </p>

      <div class="panel" id="auth-panel">
        <label for="token">Token admin (Bearer)</label>
        <input type="password" id="token" autocomplete="off" placeholder="Colle le token" />
        <div class="row">
          <button type="button" id="btn-save-token">Enregistrer dans cette session</button>
          <button type="button" class="secondary" id="btn-clear-token">Oublier le token</button>
        </div>
        <p class="msg" id="auth-msg" hidden></p>
      </div>

      <div class="panel" id="editor-panel" hidden>
        <h2 style="font-size: 1rem; margin: 0 0 0.75rem">Édition</h2>
        <input type="hidden" id="edit-id" value="" />
        <label for="edit-title">Titre (ligne ## dans le launcher)</label>
        <input type="text" id="edit-title" maxlength="500" />
        <label for="edit-body" style="margin-top: 0.65rem">Corps (Markdown)</label>
        <textarea id="edit-body"></textarea>
        <label for="edit-sort" style="margin-top: 0.65rem">Ordre (plus grand = plus haut)</label>
        <input type="number" id="edit-sort" value="0" step="1" />
        <label style="margin-top: 0.65rem; display: flex; gap: 0.5rem; align-items: center; color: var(--text)">
          <input type="checkbox" id="edit-published" />
          Publié (visible site + launcher)
        </label>
        <div class="row">
          <button type="button" id="btn-save">Enregistrer</button>
          <button type="button" class="secondary" id="btn-new">Nouveau brouillon</button>
        </div>
        <p class="msg" id="editor-msg" hidden></p>
      </div>

      <div class="panel">
        <div class="row" style="margin: 0 0 0.5rem">
          <h2 style="font-size: 1rem; margin: 0">Articles</h2>
          <button type="button" class="secondary" id="btn-refresh">Actualiser</button>
        </div>
        <ul class="posts" id="post-list"></ul>
        <p class="msg err" id="list-msg" hidden></p>
      </div>
    </div>
    <script src="admin.js" defer></script>
  </body>
</html>
